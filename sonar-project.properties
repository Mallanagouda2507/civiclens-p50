# ==============================================================================
# SonarQube Project Configuration: CivicLens (Question 50 - P50)
# Municipal Complaint Portal with Geotagging
# ==============================================================================

# Unique Project Identification
sonar.projectKey=civiclens-municipal-portal
sonar.projectName=CivicLens - Municipal Complaint Portal with Geotagging (P50)
sonar.projectVersion=1.0.0

# Source & Test Directory Locations
sonar.sources=backend/controllers,backend/models,backend/routes,backend/services,backend/config,backend/server.js,frontend/src
sonar.tests=backend/tests,tests/selenium
sonar.test.inclusions=backend/tests/**/*.test.js,tests/selenium/**/*.js

# Exclusions for Dependencies, Transpiled Output, and Generated Reports
sonar.exclusions=**/node_modules/**,frontend/dist/**,backend/coverage/**,test-results/**,**/.git/**,**/*.test.js

# Code Quality & LCOV Coverage Report Ingestion
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

# Source File Encoding
sonar.sourceEncoding=UTF-8

# Server Target (Defaults to standard local SonarQube instance or override via SONAR_HOST_URL)
sonar.host.url=http://localhost:9000

# Issue & Rule Analysis Profiles
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S1186
sonar.issue.ignore.multicriteria.e1.resourceKey=backend/config/db.js
